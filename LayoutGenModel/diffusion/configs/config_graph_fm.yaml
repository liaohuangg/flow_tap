defaults:
  - _self_
  - model: att-gnn #graph-transformer
  - model/conv-layer@model.backbone_params: gat
  - model/size@model.backbone_params: large
  - guidance@_here_: none
  - mode@_here_: train
  - override hydra/hydra_logging: none
  - override hydra/job_logging: stdout

family: flow_matching
task: layout
num_classes: 10
method: layout-train
seed: 61
log_dir: logs/diffusion_debug
mode: train # train | finetune | ddpo
from_checkpoint: none

logger:
  filter: '.*'
  wandb: False
  wandb_entity: ""
  wandb_project: ""
wandb: null

# model params
implementation: custom
model:
  mask_key: is_ports
  use_mask_as_input: True
  max_diffusion_steps: 200
  t_encoding_type: sinusoid
  t_encoding_dim: 32
  fm_t_min: 1e-4

# clustering params
cluster:
  is_cluster: False
  num_clusters: 512
  verbose: False

# training params
batch_size: 64
val_batch_size: 64
train_steps: 3000000
print_every: 500
validate_graphs: 16
eval_every: 200000
eval_samples: 32
eval_policy: open_loop
display_examples: 1
num_output_samples: 0
lr: 3e-4
augment: False
train_data_limit: none
val_data_limit: none

# Optional training-time compactness loss. Disabled by default for compatibility.
bbox:
  train_weight: 0.0
  start_step: 0
  warmup_steps: 0
  softmax_beta: 30.0
  target_ratio: 0.95

# Optional training-time thermal surrogate loss.
# The default checkpoint is the latest HRNet thermal model; set train_weight=0
# to only keep the path available for eval/legalization overrides.
thermal:
  train_weight: 0.0
  start_step: 0
  warmup_steps: 0
  ckpt: checkpoints/thermal/thermal_ep0175.pth
  grid_size: 128
  rect_sharpness: 80.0
  smooth_max_beta: 20.0
  max_weight: 1.0
  mean_weight: 0.1
  target_max_k: 0.0

# Optional auxiliary legality-aware representation learning.
# Disabled by default; when enabled, the backbone gets overlap/boundary heads
# and the training loss adds head supervision plus direct legality penalties.
legality_aux:
  enabled: false
  start_step: 10000
  warmup_steps: 30000
  overlap_head_weight: 0.05
  boundary_head_weight: 0.05
  overlap_direct_weight: 0.05
  boundary_direct_weight: 0.05

hydra:
  output_subdir: null
  run:
    dir: .

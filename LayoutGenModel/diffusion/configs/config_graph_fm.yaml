defaults:
  - model: geometry-att-gnn
  - model/conv-layer@model.backbone_params: gat
  - model/size@model.backbone_params: large
  - guidance@_here_: none
  - mode@_here_: train
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: stdout

family: flow_matching
task: placement_first_300k
num_classes: 10
method: layout-train
seed: 61
log_dir: logs/diffusion_debug
mode: train # train | finetune | ddpo
from_checkpoint: none

logger:
  filter: '.*'
  wandb: False
  wandb_entity: ""
  wandb_project: ""
wandb: null

# model params
implementation: custom
model:
  mask_key: is_ports
  use_mask_as_input: True
  max_diffusion_steps: 200
  t_encoding_type: sinusoid
  t_encoding_dim: 32
  fm_t_min: 1e-4
  backbone_params:
    edge_features: 8
    extra_node_feature_keys: [node_power]
    extra_node_feature_normalize: graph_max
    thermal_mp_enabled: True
    thermal_mp_sigma: 0.35
    thermal_mp_topk: 0

# clustering params
cluster:
  is_cluster: False
  num_clusters: 512
  verbose: False

# training params
batch_size: 8
val_batch_size: 8
train_steps: 3000000
print_every: 500
validate_graphs: 16
eval_every: 200000
eval_samples: 32
eval_policy: open_loop
display_examples: 1
num_output_samples: 0
lr: 3e-4
augment: False
train_data_limit: none
val_data_limit: none

# Optional training-time compactness loss. Disabled by default for compatibility.
bbox:
  train_weight: 0.0
  start_step: 0
  warmup_steps: 0
  softmax_beta: 30.0
  target_ratio: 0.95

# Optional training-time thermal surrogate loss.
# The default checkpoint is the latest GNN+HRNet thermal model; set train_weight=0
# to only keep the path available for eval/legalization overrides.
thermal:
  train_weight: 0.01
  start_step: 0
  warmup_steps: 10000
  ckpt: thermalmodel/checkpoints/gnnhrnet_pwin/best.pth
  grid_size: 64
  rect_sharpness: 80.0
  hidden: 128
  heads: 4
  num_layers: 3
  base: 96
  stages: 4
  blocks_per_stage: 2
  expand_ratio: 2
  smooth_max_beta: 20.0
  max_weight: 1.0
  mean_weight: 0.1
  target_max_k: 0.0
  # Gradient-checkpoint the frozen field head so its 128-field activations are
  # recomputed in backward instead of stored (65GB -> ~11GB peak).  Keep ON.
  checkpoint_field_head: true
  # Layouts per single HRNet forward.  With checkpointing ON, chunk=2 is the
  # measured sweet spot (1.27s/11.4GB); chunk=1 is 1.47s/7.2GB, chunk=4 is
  # 1.27s/19.5GB, chunk=16 spills.  Without checkpointing, chunking does NOT
  # reduce peak memory (all chunks' activations stay alive until backward).
  chunk: 2

# Frozen neural wirelength surrogate used as an auxiliary training objective.
# Both proxy losses ramp up from the first step so they do not overwhelm the
# primary flow-matching target at initialization.
wirelength:
  train_weight: 0.02
  # Replace the fifth GeometryAttention pair feature on connected pairs with
  # WirelengthGNN's differentiable edge-distance prediction.
  pair_feature_enabled: false
  start_step: 0
  warmup_steps: 10000
  ckpt: ../wirelengthmodel/checkpoint/best_wlmodel_total_60k.pt
  normalizer: ../wirelengthmodel/checkpoint/normalizer_compat_69_76.json
  objective: log_total
  preferred_side_temperature: 0.25
  auto_fit_normalizer: false
  placement_dir: ../Dataset/dataset/placement_dataset/placement_dataset_tw
  normalizer_files: [69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80]
  normalizer_seed: 42
  normalizer_train_ratio: 0.8
  allow_partial_normalizer: false
  normalizer_cache: none

# Auxiliary legality-aware representation learning. The backbone gets
# overlap/boundary heads and training adds head supervision plus direct
# overlap and boundary penalties.
legality_aux:
  enabled: true
  start_step: 0
  warmup_steps: 10000
  overlap_head_weight: 0.02
  boundary_head_weight: 0.02
  overlap_direct_weight: 0.05
  boundary_direct_weight: 0.05

# A PNG and JSONL history are updated atomically during training so an image
# viewer can stay open on the PNG while the run continues.
monitor:
  enabled: true
  every: 100
  filename: training_monitor.png
  history_filename: training_monitor.jsonl

hydra:
  output_subdir: null
  run:
    dir: .
